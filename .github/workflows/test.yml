
name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macOS:
    name: macOS
    runs-on: macos-26
    steps:
    - name: Select Xcode 26.2
      run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
    - name: Get swift version
      run: swift --version
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete

  Linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
    - name: Get swift version
      run: swift --version
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete
